<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D11">
<title>Desco</title>
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B0D11;color:#F3F4F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
img{width:120px;height:120px;border-radius:27px;display:block;margin:0 auto 22px}
.logo{font-weight:800;letter-spacing:.28em;padding-left:.28em;font-size:15px;color:#98A2B3;margin-bottom:26px}
.card{width:100%;max-width:380px;background:#151A21;border:1px solid #262C36;border-radius:20px;padding:28px 22px}
h1{font-size:23px;line-height:1.25;margin:0 0 10px}
p{font-size:16px;line-height:1.5;color:#98A2B3;margin:0}
.ok{width:56px;height:56px;border-radius:50%;background:#34D399;color:#06281b;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.ok.err{background:#EF4444;color:#fff}
label{display:block;text-align:left;font-size:14px;color:#98A2B3;margin:18px 0 6px}
input{width:100%;font:inherit;font-size:16px;color:#F3F4F6;background:#1E242D;border:1px solid #2C3440;border-radius:12px;padding:13px 14px;outline:none}
input:focus{border-color:#34D399}
button{width:100%;margin-top:16px;font:inherit;font-size:17px;font-weight:700;color:#06281b;background:#34D399;border:0;border-radius:14px;padding:14px;cursor:pointer}
button:disabled{opacity:.5}
.msg{font-size:14px;color:#F87171;margin-top:12px;min-height:1em}
.hide{display:none}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <div class="logo">DESCO</div>
  <div class="card" id="card"></div>
</main>
<script>
const SUPA_URL='https://dbnejqxapvxxfrzdgfen.supabase.co';
const SUPA_KEY='sb_publishable_3rMyLeaE7tTtaEUPqWOP5Q_HR5KG6nV';
const card=document.getElementById('card');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(ok,title,text){card.innerHTML=`<div class="ok${ok?'':' err'}">${ok?'✓':'!'}</div><h1>${title}</h1><p>${text}</p>`}

const h=new URLSearchParams(location.hash.slice(1));
const q=new URLSearchParams(location.search);
history.replaceState(null,'',location.pathname);
const err=h.get('error_description')||q.get('error_description')||h.get('error')||q.get('error');
const token=h.get('access_token'),type=h.get('type');

if(err){
  const caducado=/expired|invalid|otp/i.test(err+' '+(h.get('error_code')||''));
  show(false,caducado?'Este enlace ya no sirve':'Algo no ha ido bien',
    caducado?'Ha caducado o ya se usó antes. Si ya confirmaste tu cuenta, entra en Desco con tu correo y contraseña. Si no, pide otro correo desde la app.':esc(err));
}else if(token&&type==='recovery'){
  card.innerHTML=`<h1>Elige una contraseña nueva</h1><p>Para tu cuenta de Desco.</p>
  <label for="p1">Contraseña nueva (mínimo 6 caracteres)</label><input id="p1" type="password" autocomplete="new-password">
  <label for="p2">Repítela</label><input id="p2" type="password" autocomplete="new-password">
  <button id="go">Guardar contraseña</button><div class="msg" id="msg"></div>`;
  const go=document.getElementById('go'),msg=document.getElementById('msg');
  go.onclick=async()=>{
    const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
    if(a.length<6){msg.textContent='Tiene que tener al menos 6 caracteres';return}
    if(a!==b){msg.textContent='Las dos contraseñas no coinciden';return}
    go.disabled=true;msg.textContent='';
    try{
      const r=await fetch(SUPA_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json',apikey:SUPA_KEY,Authorization:'Bearer '+token},body:JSON.stringify({password:a})});
      if(r.ok){show(true,'Contraseña cambiada','Ya puedes volver a Desco y entrar con tu contraseña nueva.');return}
      const j=await r.json().catch(()=>({}));const t=(j.msg||j.error_description||j.message||'')+'';
      msg.textContent=/different|same/i.test(t)?'La contraseña nueva tiene que ser distinta de la anterior':/expired|invalid|jwt/i.test(t)?'El enlace ha caducado. Pide otro correo desde la app.':'No se pudo cambiar. Inténtalo otra vez.';
    }catch(e){msg.textContent='Sin conexión. Inténtalo otra vez.'}
    go.disabled=false;
  };
}else if(token){
  show(true,'¡Cuenta confirmada!','Ya puedes volver a Desco y entrar con tu correo y tu contraseña.');
}else{
  show(true,'Desco','Esta página sirve para confirmar tu cuenta y cambiar tu contraseña desde los enlaces que te enviamos por correo.');
}
</script>
</body>
</html>
